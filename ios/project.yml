name: PiMobile
options:
  bundleIdPrefix: com.druejaramillo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  PiMobileCore:
    path: PiMobileCore
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    revision: ae8562f895de06ccb86fdb1cbb65fd99c8976e12
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: 4dcf5278fde40af60c36f667d8a472a90b38b247
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    revision: fc8c3e4f5103bf63a242453566525272e143a054
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.81.0
  SwiftNIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: 0.3.4
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 3.12.3
targets:
  PiMobile:
    type: application
    platform: iOS
    sources:
      - path: PiMobile
    dependencies:
      - package: PiMobileCore
      - package: Citadel
      - package: SwiftTerm
      - package: FluidAudio
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOFoundationCompat
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.druejaramillo.pi-mobile
        INFOPLIST_FILE: PiMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
      environmentVariables:
        OS_ACTIVITY_MODE: default
